{{ define "docs" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevUtils REST API Reference</title>
    <style>
        body {
            margin: 0;
            background-color: #080c14; /* Matches --bg-primary */
        }
        /* Custom scrollbar matching DevUtils */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 245, 255, 0.4);
        }
    </style>
</head>
<body>
    <script
        id="api-reference"
        data-url="/static/openapi.json?v={{ .Version }}"
        data-configuration='{"forceThemeMode": "dark", "theme": "deepSpace", "showSidebar": true}'
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
{{ end }}
