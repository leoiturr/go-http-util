{{ define "docs" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevUtils REST API Reference</title>
    <style>
        :root {
            --bg-primary: #0a0e0f;
        }
        [data-theme="light"] {
            --bg-primary: #f5f8f5;
        }
        body {
            margin: 0;
            background-color: var(--bg-primary);
        }
        /* Custom scrollbar matching DevUtils */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(163, 230, 53, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(45, 212, 191, 0.4);
        }
    </style>
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('devutils_theme');
                if (saved) {
                    document.documentElement.setAttribute('data-theme', saved);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    document.documentElement.setAttribute('data-theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <script
        id="api-reference"
        data-url="/static/openapi.json?v={{ .Version }}"
        data-configuration='{"forceThemeMode": "dark", "theme": "deepSpace", "showSidebar": true}'
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
{{ end }}
