{{ define "docs" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)">
    <title>DevUtils REST API Reference</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-primary: #16120f;
            --color-primary: #e4482a;
            --color-pink: #e0a03a;
        }
        [data-theme="light"] {
            color-scheme: light;
            --bg-primary: #f5efe3;
            --color-primary: #c53819;
            --color-pink: #a86f16;
        }
        body {
            margin: 0;
            background-color: var(--bg-primary);
        }
        /* Custom scrollbar matching DevUtils */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: color-mix(in srgb, var(--color-primary) 40%, transparent);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: color-mix(in srgb, var(--color-pink) 50%, transparent);
        }
    </style>
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('devutils_theme');
                if (saved) {
                    document.documentElement.setAttribute('data-theme', saved);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    document.documentElement.setAttribute('data-theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <script
        id="api-reference"
        data-url="/static/openapi.json?v={{ .Version }}"
        data-configuration='{"forceThemeMode": "dark", "theme": "deepSpace", "showSidebar": true}'
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
{{ end }}
